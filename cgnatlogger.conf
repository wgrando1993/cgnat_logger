server {
    listen 80;
    server_name _;   # ou seu domínio

    # Pasta onde você colocará os arquivos da aplicação
    root /var/www/html;
    index index.php;

    # Lida com arquivos estáticos
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Bloco PHP-FPM via TCP
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Opcional: nega acesso a .ht*
    location ~ /\.ht {
        deny all;
    }
}